[project]
name = "avl-jtag"
version = "0.1.0"
description = "Apheleia Verification Library - IEEE 1149.1 JTAG verification component driven by OpenOCD."
authors = [{name = "avl", email = "avl@projectapheleia.net"}]
maintainers = [{name = "avl", email = "avl@projectapheleia.net"}]
keywords = ["hdl", "verification", "AVL", "UVM", "JTAG", "OpenOCD"]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python"
]
dependencies = [
    "avl-core>=1.1.0",
    "cocotb>=2.0.0",
    "matplotlib>=3.10.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=0.910",
    "black>=22.3.0",
    "sphinx>=8.1.3",
    "sphinx_rtd_theme>=3.0.2",
    "ruff>=0.11.0"
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "avl_jtag" }]

[tool.ruff]
target-version = "py310"

src = ["avl", "examples", "bin"]

exclude = ["doc", "build", "dist", "venv"]

line-length = 200

fix = false

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[project.scripts]
avl-jtag-get-verilog = "avl_jtag._tools:get_verilog"
